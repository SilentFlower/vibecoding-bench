const flower = (s = 22, center = '#191b2c') => `<svg width="${s}" height="${s}" viewBox="0 0 256 256" aria-hidden="true"><defs><path id="pt" d="M128 121C116 103 94 79 94 58C94 37 109 21 128 21S162 37 162 58C162 79 140 103 128 121Z"/></defs><g fill="#ED6EA7">${[0, 72, 144, 216, 288].map(r => `<use href="#pt" transform="rotate(${r} 128 128)"/>`).join('')}</g><circle cx="128" cy="128" r="15" fill="${center}"/></svg>`;
const tag = (tone, text, dot = false) => `<span class="tag tg-${tone}${dot ? ' dot' : ''}">${text}</span>`;
const plat = p => p === 'agy' ? tag('agy', '反重力') : tag('cc', 'Claude Code');

const input = (ph, icon = 'search', w = '') => `<div class="input" style="${w ? `width:${w}px` : ''}">${icon ? ic(icon, 's14').replace('class="i', 'class="i t3') : ''}<span class="ph-t">${ph}</span></div>`;

const left = ic('right', 's14').replace('m9 18 6-6-6-6', 'm15 18-6-6 6-6');
const pager = (total, pages = 3) => `<div class="tfoot"><span>共 ${total} 条</span><span class="psize">20 条/页${ic('down', 's14')}</span><div class="pager"><span class="dis">${left}</span>${Array.from({ length: pages }, (_, i) => `<span class="${i ? '' : 'on'}">${i + 1}</span>`).join('')}<span>${ic('right', 's14')}</span></div></div>`;

    <div class="sb-brand"><span class="sb-mark">${flower(24)}</span><div><b>flower2api<span class="sb-ver up" title="发现新版本，打开系统更新">v1.0.0${ic('upCircle', 's12')}</span></b><small>让每一次调用井然有序</small></div></div>

</section>`);

    <div style="flex:1;min-width:0"><b style="font-size:13.5px;font-weight:760">安装时暂停新接单</b><p style="margin:2px 0 0;font-size:12px;color:var(--text-3);font-weight:550">等待在途工作结束后切换平台服务；2 个账号运行环境运行中，兼容的运行环境继续复用。</p></div>
    <div class="field" style="width:150px"><label>在途等待上限</label><div class="input" style="height:34px;background:var(--surface)">1<span class="t3" style="font-size:12px">分钟</span><span class="end"><span>−</span><span>+</span></span></div></div></section>`],
  `<span class="btn btn-sm btn-text">${ic('history', 's14')}版本记录与回退</span><span class="btn btn-sm btn-text">${ic('box', 's14')}运行组件与维护详情</span><span style="margin-left:auto" class="btn">${ic('refresh', 's14')}检查更新</span><span class="btn btn-primary">${ic('download', 's14')}安装更新</span>`));

pages['update-progress'] = () => {
  const L = [
    ['21:32:08', 'ok', '下载与校验', '镜像签名与摘要已核对'],
    ['21:33:40', 'ok', '候选已准备', '候选服务已就绪'],
    ['21:33:41', 'run', '等待在途完成', '仍有 2 个请求处理中，新工作已暂缓'],
    ['', 'wait', '保存数据库快照', ''], ['', 'wait', '执行数据库迁移', ''], ['', 'wait', '切换平台服务', ''],
    ['', 'wait', '验证新版本', ''], ['', 'wait', '保存安装结果', ''], ['', 'wait', '回收旧制品', ''],
  ];
  return shell('accounts', accountsBg(), updateModal(
    `<span class="pill i">${ic('refresh', 's14')}更新中</span>`,
    [updateTiles([['当前版本', 'v1.0.0'], ['目标版本', 'v1.0.1'], ['操作 ID', 'op-7f3a…91c2'], ['最近更新', '21:34:22']])
      + `<div class="strip n">${ic('info', 's14')}维护期间新工作暂缓，在途工作自然结束后继续。</div>`,
    `<section class="u-sec" style="gap:10px"><div class="u-head"><b style="font-size:14px;margin:0;display:flex;align-items:center;gap:8px">${ic('terminal', 's14').replace('class="i', 'class="i t3')}更新进度<span class="t4 mono" style="font-size:12px;font-weight:650">3 / 9</span></b><span class="live">实时</span></div>
      <div class="u-log">${L.map(([t, st, step, msg]) => `<div class="${st}"><time>${t || '—'}</time><i></i><b>${step}</b><em>${msg}</em></div>`).join('')}</div></section>`],
    `<span class="btn btn-sm btn-text">${ic('list', 's14')}操作详情与数据库快照</span><span style="margin-left:auto" class="btn">取消等待</span><span class="btn btn-primary" disabled>${ic('refresh', 's14')}更新中…</span>`));
};

/* ---------------- 主题设置（新增页面，草稿只在当前浏览器生效） ---------------- */
pages.theme = () => {
  const presets = [['花瓣紫', '品牌默认', '#6c54b4'], ['深海蓝', '冷静专业', '#2f6bd8', 1], ['松石绿', '清爽自然', '#0f9f8f'], ['暮光橙', '温暖醒目', '#e2742b'], ['玫瑰红', '柔和亲切', '#d64a7b'], ['石墨', '克制中性', '#3d4352']];
  const colors = [['品牌主色', 'colorPrimary', '#2f6bd8', '完整色阶与界面基调', 1], ['成功色', 'colorSuccess', '#12b981', '成功反馈与状态'], ['警告色', 'colorWarning', '#f59e0b', '额度与风险提醒'], ['错误色', 'colorError', '#ef4444', '失败与破坏性操作'], ['信息色', 'colorInfo', '#5983f4', '系统与请求信息']];
  const draft = '--primary:#2f6bd8;--primary-hover:#2559b8;--primary-container:#edf3fd;--primary-text:#2556b0;--primary-ring:rgba(47,107,216,.18)';
  return shell('theme', ph('主题设置', `自定义当前浏览器中的控制台主题<span class="dirty">1 处修改待应用</span>`, `<span class="btn btn-sm btn-text">${ic('undo', 's14')}撤销草稿</span><span class="btn btn-sm">${ic('rotate', 's14')}恢复默认</span><span class="btn btn-sm btn-primary">${ic('save', 's14')}保存并应用</span>`)
    + `<div class="th"><aside class="card th-panel">
      ${seg([['全局', undefined, 1], ['组件']])}${input('搜索主题、颜色或组件 Token')}
      <div class="th-group"><h5>主题模式</h5>${seg([[`${ic('monitor', 's14')}跟随系统`], [`${ic('sun', 's14')}浅色`, undefined, 1], [`${ic('moon', 's14')}深色`]])}</div>
      <div class="th-group"><h5>主题预设</h5><div class="th-presets">${presets.map(([n, d, c, on]) => `<div class="${on ? 'on' : ''}" style="--c:${c}"><i style="background:linear-gradient(135deg, ${c} 0 38%, color-mix(in srgb, ${c} 22%, #fff) 38% 66%, #f3f4f8 66%)"></i><b>${n}</b><small>${d}</small>${on ? ic('check', 's12') : ''}</div>`).join('')}</div></div>
      <div class="th-group"><h5>表面材质</h5>${seg([['默认', undefined, 1], ['柔光']])}</div>
      ${seg([['颜色', undefined, 1], ['尺寸'], ['风格']])}
      <div class="th-group">${colors.map(([l, t, c, d, mod]) => `<div class="tf"><i style="background:${c}"></i><div style="min-width:0"><b>${l}${mod ? tag('primary', '已修改') : ''}</b><small>${d}</small></div><code>${c}</code></div>`).join('')}</div>
    </aside>
    <section class="card th-preview"><div class="tb"><div><div class="sec-t" style="font-size:15px">实时预览</div><p style="margin:2px 0 0;font-size:12px;color:var(--text-3);font-weight:550">草稿在隔离画板中渲染，保存前不影响控制台。</p></div><div class="tb-spacer"></div>${seg([['首页画板', undefined, 1], ['组件校样']])}<div class="zoom"><span>${ic('minus', 's14')}</span><span>50%</span><span>${ic('plus', 's14')}</span><span>${ic('fit', 's14')}</span></div></div>
      <div class="canvas"><div class="artboard"><div style="${draft}">${shell('accounts', accountsBg())}</div></div><span class="hint">拖动空白处平移 · 滚轮缩放</span></div>
    </section></div>`);
};

/* ---------------- 移动端账号 ---------------- */
pages.mobile = () => `<div class="m-app"><div class="m-top"><span class="sb-mark" style="width:34px;height:34px;border-radius:9px">${flower(20)}</span><b>账号管理</b><div class="r"><span>${ic('search', 's18')}</span><span>${ic('menu', 's18')}</span></div></div>
  <div style="padding:12px 16px 0;overflow:hidden">${seg([['全部', 101, 1], ['正常', 101], ['关注', 0], ['已停用', 0]])}</div>
  <div style="padding:12px 16px;display:flex;flex-direction:column;gap:12px">${accountCard(A[0], 0)}</div></div>`;

const key = location.hash.slice(1) || 'accounts';
document.getElementById('root').innerHTML = (pages[key] || pages.accounts)();
</script>
