name: flower2api 联合构建验证
on:
  workflow_dispatch:
  push:
    branches: [v3, flower2api]
  pull_request:
    branches: [v3, flower2api]
permissions:
  contents: read
concurrency:
  group: v3-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出统一源码仓库
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      # 与正式镜像保持同一 Python 次版本，避免 runner 默认版本漂移破坏依赖安装。
      - name: 设置 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 验证系统更新合同与恢复状态机
        run: |
          python3 -m venv "$RUNNER_TEMP/v3-update-venv"
          "$RUNNER_TEMP/v3-update-venv/bin/pip" install -r services/orchestrator/requirements.txt PyYAML==6.0.3
          python3 deploy/flower2api/verify_database_definitions.py
          # 三组独立测试并行收口；宿主快照仍由入口以 root 权限验证。
          python3 deploy/flower2api/verify_release_tests.py --python "$RUNNER_TEMP/v3-update-venv/bin/python"
      - name: 准备共享构建缓存
        id: flower2api-cache
        continue-on-error: true
        uses: ./.github/actions/flower2api-build-cache
      - name: 记录缓存准备回退
        if: steps.flower2api-cache.outcome == 'failure'
        run: printf '%s\n' '::warning::CI缓存准备失败，本次沿普通Docker构建路径执行。'
      - name: 准备双版本原生运行时
        uses: ./.github/actions/flower2api-native-runtime
      - name: 准备AGY处理产物
        # 固定执行映像复用本仓处理产物，源码适配层由当前快照构建。
        uses: ./.github/actions/flower2api-agy-artifact
      - name: 构建两个镜像并生成版本清单
        run: python3 deploy/flower2api/manage.py build --release ci-${{ github.run_id }}-${{ github.run_attempt }} --manifest releases/v3-local.json
      - name: 验收镜像内AGY能力
        env:
          GH_TOKEN: ${{ github.token }}
          V3_SYSTEM_RELEASE_PUBLIC_KEY: ${{ vars.V3_SYSTEM_RELEASE_PUBLIC_KEY }}
          TRUSTED_CANDIDATE: ${{ github.repository == 'SilentFlower/vibecoding-bench' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/v3' || github.ref == 'refs/heads/flower2api') }}
        run: |
          if [[ "$TRUSTED_CANDIDATE" == 'true' && -n "$V3_SYSTEM_RELEASE_PUBLIC_KEY" ]]; then
            sudo --preserve-env=GITHUB_ACTIONS,GH_TOKEN "$RUNNER_TEMP/v3-update-venv/bin/python" deploy/flower2api/verify_database_compatibility.py --manifest releases/v3-local.json --output "$RUNNER_TEMP/v3-database-compatibility.json" --public-key "$V3_SYSTEM_RELEASE_PUBLIC_KEY" --workers 4 &
            proof_pid=$!
            trap 'wait "$proof_pid" || true' EXIT
          elif [[ "$TRUSTED_CANDIDATE" == 'true' ]]; then
            printf '%s\n' '::warning::配置 V3_SYSTEM_RELEASE_PUBLIC_KEY 后可以在候选构建阶段演练，本批由正式发布补跑。'
          fi
          # 合成状态目录须归属容器UID 1001，沿宿主验证权限调用同一虚拟环境。
          sudo "$RUNNER_TEMP/v3-update-venv/bin/python" deploy/flower2api/verify_agy_images.py --manifest releases/v3-local.json
          if [[ -n "${proof_pid:-}" ]]; then
            if wait "$proof_pid"; then
              sudo install -m 600 -o "$(id -u)" -g "$(id -g)" "$RUNNER_TEMP/v3-database-compatibility.json" releases/database-compatibility.json
            else
              printf '%s\n' '::warning::候选兼容演练失败，正式发布将重新演练。'
            fi
            trap - EXIT
          fi
      - name: 导出可信候选镜像
        if: >-
          github.repository == 'SilentFlower/vibecoding-bench' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/v3' || github.ref == 'refs/heads/flower2api')
        run: |
          python3 deploy/flower2api/candidate_artifacts.py export --manifest releases/v3-local.json --output releases/candidate
          if [[ -f releases/database-compatibility.json ]]; then
            mv -- releases/database-compatibility.json releases/candidate/database-compatibility.json
          fi
      - name: 上传可信候选产物
        if: >-
          github.repository == 'SilentFlower/vibecoding-bench' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/v3' || github.ref == 'refs/heads/flower2api')
        uses: actions/upload-artifact@v4
        with:
          name: v3-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: releases/candidate/
      - name: 保存本地构建清单
        uses: actions/upload-artifact@v4
        with:
          name: v3-build-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: releases/v3-local.json
