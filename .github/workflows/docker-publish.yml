name: 旧三镜像发布入口已退役
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 说明正式交付入口
        run: |
          echo 'LEGACY_IMAGES_RETIRED：旧三镜像已退役，请使用 flower2api 手动发布入口。'
          exit 1
