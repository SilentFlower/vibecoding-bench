name: flower2api 手动发布
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 确认发布当前所选分支的版本，供现有 flower2api／v3 实例升级
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      github.repository == 'SilentFlower/vibecoding-bench' &&
      (github.ref == 'refs/heads/v3' || github.ref == 'refs/heads/flower2api')
    permissions:
      contents: write
      packages: write
    concurrency:
      group: v3-signed-system-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      V3_PUBLISH_CONFIRMED: ${{ inputs.publish }}
    steps:
      - name: 检出统一源码仓库
        uses: actions/checkout@v6
      # 与正式镜像保持同一 Python 次版本，避免 runner 默认版本漂移破坏依赖安装。
      - name: 设置 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 预检发布来源与签名配置
        env:
          V3_SYSTEM_RELEASE_PRIVATE_KEY: ${{ secrets.V3_SYSTEM_RELEASE_PRIVATE_KEY }}
        run: python3 deploy/v3/publish_system_release.py --check-signing
      - name: 验证系统更新合同与恢复状态机
        run: |
          python3 -m venv "$RUNNER_TEMP/v3-update-venv"
          "$RUNNER_TEMP/v3-update-venv/bin/pip" install -r services/orchestrator/requirements.txt PyYAML==6.0.3
          python3 deploy/v3/verify_database_definitions.py
          # 宿主快照测试需核验跨进程数据库句柄，使用与正式执行器相同的 root 权限。
          sudo "$RUNNER_TEMP/v3-update-venv/bin/python" -m unittest discover -s deploy/v3 -p 'test_system*.py'
          "$RUNNER_TEMP/v3-update-venv/bin/python" -m unittest discover -s services/orchestrator -p 'test_system_update*.py'
          PYTHONPATH=services/orchestrator:deploy/v3 "$RUNNER_TEMP/v3-update-venv/bin/python" -m unittest test_publication test_system_workflow test_database_definitions test_database_migrations test_database_compatibility
      - name: 构建两个镜像并生成版本清单
        run: python3 deploy/v3/manage.py build --release ci-${{ github.run_id }}-${{ github.run_attempt }} --manifest releases/v3-local.json
      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 真实旧库升级与旧程序回退演练
        env:
          V3_SYSTEM_RELEASE_PRIVATE_KEY: ${{ secrets.V3_SYSTEM_RELEASE_PRIVATE_KEY }}
        run: |
          # 沿正式执行器权限验证原 v3 双库与回退，证据失败直接阻断发布。
          sudo --preserve-env=V3_SYSTEM_RELEASE_PRIVATE_KEY "$RUNNER_TEMP/v3-update-venv/bin/python" deploy/v3/verify_database_compatibility.py --manifest releases/v3-local.json --output releases/database-compatibility.json
          sudo chown -- "$(id -u):$(id -g)" releases/database-compatibility.json
      - name: 发布同批镜像并保存交付包
        run: python3 deploy/v3/manage.py publish --manifest releases/v3-local.json --output releases/v3.json --bundle releases/v3-images.tar.gz
      - name: 保存联合清单与同批镜像包
        uses: actions/upload-artifact@v4
        with:
          name: v3-release-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            releases/v3.json
            releases/database-compatibility.json
            releases/v3-images.tar.gz
      - name: 发布受信系统版本与原子目录
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V3_SYSTEM_RELEASE_PRIVATE_KEY: ${{ secrets.V3_SYSTEM_RELEASE_PRIVATE_KEY }}
        run: python3 deploy/v3/publish_system_release.py
