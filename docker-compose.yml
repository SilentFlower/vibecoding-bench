# =======================================================================
# vibecoding-bench
# 使用：
#   1. cp .env.example .env && 编辑 HOST_BENCH_DATA 为本目录 data/ 的绝对路径
#   2. docker compose --profile build build          构建三个镜像
#   3. ./scripts/init-account.sh <name>              OAuth 登录至少一个账号
#   4. docker compose up -d orchestrator             启动后端
#   5. 浏览器打开 http://localhost:${BENCH_PORT:-8000}
# =======================================================================
services:
  orchestrator:
    build: ./orchestrator
    image: vibebench-orchestrator:latest
    container_name: vibebench-orchestrator
    ports:
      - "${BENCH_PORT:-8000}:8000"
    environment:
      BENCH_DATA: /data
      HOST_BENCH_DATA: ${HOST_BENCH_DATA:?HOST_BENCH_DATA must be set in .env (absolute path to ./data on host)}
      TOPICS_FILE: /repo/topics.md
      WEBUI_DIR: /webui
      WORKER_IMAGE: vibebench-worker:latest
      SIDECAR_IMAGE: vibebench-sidecar:latest
      CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.257}
      CLAUDE_CODE_EFFORT_LEVEL: ${CLAUDE_CODE_EFFORT_LEVEL:-max}
      CLAUDE_DEFAULT_MODEL: ${CLAUDE_DEFAULT_MODEL:-opus[1m]}
      CC2API_BASE_URL: ${CC2API_BASE_URL:-}
      CC2API_ADMIN_PASSWORD: ${CC2API_ADMIN_PASSWORD:-}
      CC2API_REQUEST_TIMEOUT_SEC: ${CC2API_REQUEST_TIMEOUT_SEC:-15}
      WARMUP_SCHEDULER_TICK_SEC: ${WARMUP_SCHEDULER_TICK_SEC:-30}
      WARMUP_SYNC_RETRY_SEC: ${WARMUP_SYNC_RETRY_SEC:-900}
      SAVE_FULL_FLOWS: ${SAVE_FULL_FLOWS:-0}
      CLEAN_WORKSPACE_DEPS: ${CLEAN_WORKSPACE_DEPS:-1}
      TIMEOUT_WRAPUP_SEC: ${TIMEOUT_WRAPUP_SEC:-600}
      OAUTH_CREDENTIAL_SYNC_INTERVAL_SEC: ${OAUTH_CREDENTIAL_SYNC_INTERVAL_SEC:-15}
      OAUTH_401_PROFILE_WAIT_SEC: ${OAUTH_401_PROFILE_WAIT_SEC:-90}
      CLAUDE_API_STALL_WATCHDOG_SEC: ${CLAUDE_API_STALL_WATCHDOG_SEC:-400}
      CLAUDE_API_STALL_MAX_RECOVERIES: ${CLAUDE_API_STALL_MAX_RECOVERIES:-1}
      CLAUDE_BUSY_INTERRUPT_GRACE_SEC: ${CLAUDE_BUSY_INTERRUPT_GRACE_SEC:-8}
      CLAUDE_API_STALL_RECOVERY_PROMPT: ${CLAUDE_API_STALL_RECOVERY_PROMPT:-}
      PER_ACCOUNT_CONCURRENCY: 2
      SIDECAR_BOOT_WAIT: "4"
      SIDECAR_READY_TIMEOUT: ${SIDECAR_READY_TIMEOUT:-120}
    volumes:
      - ./data:/data
      - ./topics.md:/repo/topics.md:ro
      - ./webui:/webui:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # 以下两个仅用于 build 镜像（profile=build 时才生效，不会被默认 up）
  worker-image:
    build: ./images/worker
    image: vibebench-worker:latest
    profiles: ["build"]
    command: ["true"]

  sidecar-image:
    build: ./images/sidecar
    image: vibebench-sidecar:latest
    profiles: ["build"]
    command: ["true"]
