/** 统一筛选口径；作业繁忙与环境异常分别呈现。@param row 示例环境。@param filter 状态筛选。@return 是否匹配。 */
function environmentMatchesState(row,filter){return filter==='all'||(filter==='attention'?!['ready','stopped'].includes(row.state):row.state===filter)}
/** 将服务端状态映射为可读文本，未知值保留原意。@param row 示例环境。@return 状态名称。 */
function environmentStateLabel(row){return ({ready:'就绪',stopped:'已停止',starting:'启动中',reconcile:'需要对账',failed:'异常'})[row.state]||'未知状态：'+escape(row.state||'未提供')}
/** 读取独立的原生准备快照，避免把历史预热当成当前就绪。@param row 示例环境。@return 准备文本。 */
function environmentPreparationLabel(row){const prep=row.native_preparation;return ({ready:'原生准备就绪',busy:'暖进程使用中',preparing:'原生准备中',failed:'原生准备失败',unknown:'准备状态待检查',disabled:'使用原有转发',sleeping:'等待运行时段',unprepared:'等待准备'})[prep?.state]||'准备状态未知'}
/** 根据配置及生效快照显示加速和采集，未观测不作关闭解释。@param row 示例环境。@param kind 功能名称。@return 展示文本。 */
function environmentFeatureLabel(row,kind){const value=kind==='criu'?row.criu:row.capture,observed=kind==='criu'?row.criu_applied:row.capture_applied;if(observed==null)return '状态未知';if(!observed)return value?'待生效':'待关闭';return value?'已生效':'已关闭'}
/** 渲染状态密集且可直达配置的环境卡片。@return 过滤后的卡片HTML。 */
function environmentCards(){
 const rows=accounts.filter(a=>{const row=environmentDemo.get(a.id);return row&&environmentMatchesState(row,environmentView.filter)&&[a.name,a.email,row.environment_id].join(' ').toLowerCase().includes(environmentView.query.trim().toLowerCase())});
 return rows.map(a=>{const row=environmentDemo.get(a.id),prep=row.native_preparation,attention=!['ready','stopped'].includes(row.state),disabled=row.state==='stopped';return `<article class="panel environment environment-rich" data-environment-card="${a.id}"><header class="environment-card-head"><span class="initial" style="background:${a.color};color:${a.tone}">${icon('box')}</span><div class="environment-identity"><h2>${escape(a.name)}</h2><button data-open-account="${a.id}">${escape(a.email)} ${icon('arrow')}</button></div><span class="environment-status ${attention?'warning':disabled?'muted':'healthy'}"><i></i>${environmentStateLabel(row)}</span></header><div class="environment-id"><code>${escape(row.environment_id)}</code><span>第 ${row.generation} 代</span></div><div class="environment-role-strip">${[['cli','CLI'],['sender','发送器'],['network','网络']].map(([key,label])=>{const state=row.role_status[key],text=({running:'运行中',stopped:'已停止',restarting:'重启中',missing:'未创建',exited:'已退出'})[state]||'未知';return `<div class="${state==='running'?'running':state==='restarting'?'warning':''}"><i></i><span>${label}</span><strong>${text}</strong></div>`}).join('')}</div><div class="environment-resources-grid"><div><span>内存配置</span><strong>${escape(row.fingerprint.mem)}</strong></div><div><span>CLI CPU</span><strong>${row.cliCpu}<small> 核</small></strong></div><div><span>发送器 CPU</span><strong>${row.senderCpu}<small> 核</small></strong></div><div><span>网络 CPU</span><strong>${row.networkCpu}<small> 核</small></strong></div></div><div class="environment-version-line"><span>CLI <strong>${escape(row.cli_versions.join(' / ')||'未安装')}</strong></span><button data-environment-open="kernel" data-environment-id="${a.id}">内核 <strong>${escape(row.kernel)}</strong>${icon('chevron')}</button></div><section class="environment-readiness ${attention?'warning':disabled?'muted':''}"><div><strong>${icon(attention?'clock':'check')}${environmentPreparationLabel(row)}</strong><span class="environment-job">${row.busy?'CLI 作业执行中':'CLI 作业空闲'}</span></div><p>${row.notice?escape(row.notice):['ready','busy'].includes(prep?.state)?`空闲暖进程 <b>${prep.idle_workers??'—'}</b><span> / </span>存活 <b>${prep.live_workers??'—'}</b> · ${prep.pid?'空闲 PID '+prep.pid:'空闲 PID 未观测'}`:prep?.state==='disabled'?'当前转发方式使用常规请求通道':'等待最新准备快照，进程数量尚未观测'}</p></section><div class="environment-feature-row"><button data-environment-open="resources" data-environment-id="${a.id}"><span>CRIU 加速</span><strong class="${row.criu&&!row.criu_applied?'pending':''}">${environmentFeatureLabel(row,'criu')}</strong></button><button data-environment-open="resources" data-environment-id="${a.id}"><span>内容采集</span><strong class="${row.capture&&!row.capture_applied?'pending':''}">${environmentFeatureLabel(row,'capture')}</strong></button></div><button class="environment-schedule-summary" data-environment-open="schedule" data-environment-id="${a.id}">${icon('clock')}<span>${row.start}–${row.end} <small>${escape(row.timezone)}</small></span>${icon('chevron')}</button><footer class="environment-card-actions"><button data-open-environment="${a.id}">${icon('box')}环境详情</button><button data-environment-open="resources" data-environment-id="${a.id}">${icon('settings')}资源配置</button><button data-environment-open="kernel" data-environment-id="${a.id}">${icon('spark')}内核管理</button><button data-environment-open="maintenance" data-environment-id="${a.id}">${icon('shield')}维护</button></footer></article>`}).join('')||'<section class="environment-empty"><h3>没有匹配的运行环境</h3><p>调整名称或状态筛选后重试</p><button class="btn" data-environment-reset>重置筛选</button></section>';
}

 const windowStats=(days)=>({requests:account.id===6?0:account.id*128*(days?4:1),tokens:account.id===6?0:account.id*845000*(days?4:1),cost_usd:account.id===6?0:account.id*4.85*(days?4:1),unpriced_requests:account.id===3?2:0,partial_requests:account.id===3?1:0,starts_at:new Date(usageDemoNow-(days?7*86400000:5*3600000)).toISOString(),ends_at:days?reset7:reset5,basis:account.id===3?'rolling':'quota',coverage_complete:account.id!==3,estimated_total_cost_usd:account.id===1?(days?107.78:15.16):null});
 account.request_usage=account.id===4?null:{recorded_since:new Date(usageDemoNow-10*86400000).toISOString(),five_hour:windowStats(false),seven_day:windowStats(true)};

/** 区分缺失、过期与真实零值，与原账号页的状态含义一致。@param window 额度观察。@return 展示文本与有效比例。 */
function previewUsageState(window){if(!window||!Number.isFinite(window.utilization)||window.utilization<0)return {label:'未知',percent:0};if(window.resets_at){const reset=Date.parse(window.resets_at);if(!Number.isFinite(reset))return {label:'未知',percent:0};if(reset<=Date.now())return {label:'待更新',percent:0}}else if(window.utilization>0)return {label:'未知',percent:0};return {label:Math.round(window.utilization)+'%',percent:window.utilization}}
/** 紧凑格式化本地观测数量。@param value 原值。@return 展示文字。 */
function previewUsageNumber(value){return value>=1000000?(value/1000000).toFixed(1).replace(/\.0$/,'')+'M':value>=1000?(value/1000).toFixed(1).replace(/\.0$/,'')+'K':String(value)}
/** 显示仍有效的官方窗口重置时间。@param window 额度观察。@return 倒计时与时间。 */
function previewUsageReset(window){const reset=Date.parse(window?.resets_at);if(!Number.isFinite(reset)||reset<=Date.now())return '';const minutes=Math.ceil((reset-Date.now())/60000),days=Math.floor(minutes/1440),hours=Math.floor(minutes%1440/60),remaining=minutes%60;return `<span>${days?days+'天 ':''}${hours}小时 ${remaining}分后重置</span><time datetime="${escape(window.resets_at)}">${new Date(reset).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}</time>`}
/** 保留原窗口的请求、Token及费用观测，模型子窗口不分摊本地统计。@param stats 本地统计。@param label 窗口名。@param accountId 卡片账号ID；为空时展示完整统计。@return 统计标签HTML。 */
function previewUsageStats(stats,label,accountId=null){
 if(!stats||(stats.basis==='quota'&&Date.parse(stats.ends_at)<=Date.now()))return '<p class="usage-unobserved">统计待更新</p>';
 const note=(stats.basis==='rolling'?'最近 '+label:'当前额度周期')+'内经过网关的请求，费用按模型 API 单价折算'+(stats.unpriced_requests?'；'+stats.unpriced_requests+' 次费用未知':'')+(stats.partial_requests?'；'+stats.partial_requests+' 次用量不完整':'');
 const cost=stats.requests>0&&stats.unpriced_requests===stats.requests?'费用未知':(stats.unpriced_requests||stats.partial_requests?'已知':'折算')+' $'+stats.cost_usd.toFixed(2);
 const items=[...(accountId==null&&stats.basis==='rolling'?['最近 '+label]:[]),previewUsageNumber(stats.requests)+' 请求',previewUsageNumber(stats.tokens)+' Token',cost];
 if(stats.estimated_total_cost_usd!=null)items.push('预计总费用 $'+stats.estimated_total_cost_usd.toFixed(2));
 const description=items.join(' · ')+'；'+note+(stats.estimated_total_cost_usd!=null?'；预计总费用按网关费用与官方已用比例估算，并非官方美元配额':'');
 const bubble={label:label==='5h'?'5 小时':'7 天',items:[['请求数',stats.requests.toLocaleString('zh-CN')],['Token',stats.tokens.toLocaleString('zh-CN')],['折算费用',cost],['预计总费用',stats.estimated_total_cost_usd!=null?'$'+stats.estimated_total_cost_usd.toFixed(2):'未提供估算']],note,estimated:stats.estimated_total_cost_usd!=null};
 return `<div class="usage-stat-chips" tabindex="0" role="button" data-usage-bubble="${escape(JSON.stringify(bubble))}" aria-label="${escape(description)}">${items.map(item=>`<span>${escape(item)}</span>`).join('')}</div>`;
}
/** 对齐原用量窗口，保留5小时、7天、Fable，移除独立Sonnet展示。@param account 账号。@param detailed 是否展示完整统计。@return 用量区域HTML。 */
function renderAccountUsage(account,detailed=false){const source=account.usage_data,stats=account.request_usage;return `<section class="account-usage aligned-usage" aria-label="${escape(account.name)}用量"><div class="usage-heading"><span>用量</span><span class="usage-fetch-time">${account.usage_fetched_at?new Date(account.usage_fetched_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})+' 更新':'未刷新'}</span><button data-account-action="usage" data-account-id="${account.id}">${icon('refresh')}刷新</button></div>${stats?`<p class="usage-record-start" title="仅统计经过网关的请求；其他入口消费不在此金额中">网关记录始于 ${new Date(stats.recorded_since).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'})}</p>`:''}${[['five_hour','5 小时','5h',account.five_hour_usage_limit_percent],['seven_day','7 天','7d',account.seven_day_usage_limit_percent],['seven_day_fable','7 天 Fable','',null]].map(([key,label,short,limit])=>{const window=source?.[key],value=previewUsageState(window);return `<div class="aligned-usage-window" data-usage-window="${key}">${short?previewUsageStats(stats?.[key],short,detailed?null:account.id):''}<div class="aligned-usage-label"><span>${label}${limit==null?'':limit>0?' · 上限 '+limit+'%':' · 未限制'}</span><strong>${key==='five_hour'&&source?.five_hour===null?'当前未返回5小时窗口':value.label}</strong></div><div class="bar"><i style="width:${Math.max(0,Math.min(value.percent,100))}%;background:${value.percent>=80?'#cf5964':value.percent>=50?'#d4a659':'#348b73'}"></i></div><div class="aligned-usage-reset">${previewUsageReset(window)}</div></div>`}).join('')}</section>`}
/** 从账号和登录草稿派生代理引用，绑定账号按网关归属去重。@param id 代理编号。@return 带归属类型的使用者。 */

/** 按引用所属模块生成跳转入口，避免两域ID相同导致误跳。@param item 引用。@param edit 是否直达配置。@return 按钮属性。 */

/** 搜索并分批渲染候选，避免大量线路撑开配置区。@return 无。 */

function proxyRows(){return filteredProxies().map(proxy=>{const linked=accountsUsingProxy(proxy.id),o=proxy.observation,active=linked.filter(a=>a.kind==='gateway'&&(proxy.usage?.[a.id]||0)>0),inFlight=active.reduce((n,a)=>n+proxy.usage[a.id],0),stale=proxy.status!=='ready';return `<tr data-proxy-row="${proxy.id}"><td><div class="account-name"><span class="initial">${icon('globe')}</span><span><strong>${escape(proxy.name)}</strong><small><code>${escape(proxy.url)}</code></small></span></div></td><td><div class="proxy-exit"><code>${o?escape(o.ip):'—'}</code><span>${o?`<b>${escape(o.code||'—')}</b>${escape(o.region||'地区未知')}${o.city&&o.city!==o.region?' · '+escape(o.city):''}`:proxy.status==='failed'?'检测失败，出口未知':proxy.status==='testing'?'正在获取出口':'等待检测'}</span>${o&&stale?'<small class="stale-note">上次成功结果</small>':''}</div></td><td><div class="proxy-latency"><strong class="${o&&o.latencyMs>120?'slow':''}">${o?.latencyMs==null?'—':o.latencyMs}<small>${o?.latencyMs==null?'':' ms'}</small></strong><span>${o?(stale?'上次成功 ':'最近检测 ')+new Date(o.checkedAt).toLocaleTimeString('zh-CN',{hour12:false}):proxy.checkedAt?'最近检测 '+new Date(proxy.checkedAt).toLocaleTimeString('zh-CN',{hour12:false}):'尚未检测'}</span></div></td><td><span class="status-dot ${proxy.status==='failed'?'warn':proxy.status==='ready'?'':'off'}">${proxyState(proxy)}</span>${proxy.error?`<small class="proxy-error">${escape(proxy.error)}</small>`:''}</td><td class="proxy-expiry-cell" data-proxy-expiry="${proxy.id}">${proxyExpiryMarkup(proxy)}</td><td><div class="proxy-usage"><div class="proxy-usage-count"><strong>${linked.length}</strong> 个使用 · <strong>${active.length}</strong> 个活跃</div><span>${inFlight} 个请求处理中</span><div class="proxy-account-chips">${linked.slice(0,2).map(a=>`<button type="button" ${proxyReferenceAction(a)} title="${a.kind==='draft'?'继续登录':'查看账号详情'}">${escape(a.name)}</button>`).join('')}${linked.length>2?`<span>+${linked.length-2}</span>`:''}</div><button class="proxy-expand-button" data-proxy-action="accounts" data-proxy-id="${proxy.id}" aria-expanded="${expandedProxyId===proxy.id}">${expandedProxyId===proxy.id?'收起账号':'查看使用账号'} ${icon('chevron')}</button></div></td><td><div class="buttons proxy-row-actions"><button class="btn small" data-proxy-action="test" data-proxy-id="${proxy.id}" ${proxy.status==='testing'?'disabled':''}>检测</button><button class="btn small" data-proxy-action="edit" data-proxy-id="${proxy.id}">编辑</button><button class="token-delete" data-proxy-action="delete" data-proxy-id="${proxy.id}">删除</button></div></td></tr>${expandedProxyId===proxy.id?proxyAccountsPanel(proxy):''}`}).join('')||`<tr><td colspan="7" class="empty">${previewProxies.length?'没有匹配的代理，可更换关键词或清空搜索':'还没有代理，可添加或批量导入'}</td></tr>`}
function proxyPage(){return heading('资源','代理管理','出口位置、连接质量与账号使用情况，一处查看。',button('批量导入','proxy-import','','download')+button('添加代理','proxy-add','primary','plus'))+`<div class="proxy-summary"><span><strong>${previewProxies.length}</strong> 条代理</span><span><strong>${previewProxies.filter(p=>p.status==='ready').length}</strong> 条可用</span><span><strong>${previewProxies.filter(p=>accountsUsingProxy(p.id).length).length}</strong> 条被使用</span><span>出口、地区与延迟均为示例检测结果</span></div><section class="panel"><div class="panel-head proxy-toolbar"><h2>代理线路 <small id="proxy-result-count">${filteredProxies().length} / ${previewProxies.length} 条</small></h2><label class="scheduling-search proxy-search">${icon('search')}<input type="search" id="proxy-search" aria-label="搜索代理" placeholder="名称、地址、出口 IP 或地区" value="${escape(proxyQuery)}"><button type="button" id="proxy-search-clear" aria-label="清空代理搜索" ${proxyQuery?'':'hidden'}>${icon('close')}</button></label><button class="btn small" data-action="proxy-test-all">${icon('wave')}批量检测</button></div><div class="table-scroll"><table class="proxy-table"><thead><tr><th>代理线路</th><th>出口 IP / 地区</th><th title="经该代理访问检测目标的往返耗时；与模型首字耗时分开展示">检测延迟</th><th>连接状态</th><th>到期时间</th><th>账号使用情况</th><th>操作</th></tr></thead><tbody id="proxy-rows">${proxyRows()}</tbody></table></div></section><p class="bottom-note">${icon('shield')}检测延迟：经过该代理访问检测目标的往返耗时 · 预览为本地模拟</p>`}
/** 编辑示例代理。@param id 编号，null为新增。@return 无。 */
function editProxy(id=null){
 const p=previewProxies.find(p=>p.id===id);let fields={protocol:'http',host:'',port:8080,username:'',password:''},parseError='';
 // 编辑入口必须先可达，历史地址格式异常时让用户在同一表单修复。
 if(p){try{fields=parseProxyInput(p.url)}catch{parseError='当前地址需要修正，请重新识别或填写主机与端口。原配置会保留到保存成功。'}}
 actionModal(p?'编辑代理':'添加代理',`<form class="complete-account-form proxy-structured-form" data-form="proxy" data-proxy-id="${p?.id||''}"><section class="proxy-recognize"><label for="proxy-import-input">一键识别代理</label><div class="proxy-import-row"><input id="proxy-import-input" name="proxy_input" type="password" value="${escape(p?.url||'')}" autocomplete="new-password" placeholder="粘贴代理地址，自动拆分类型与认证信息"><button type="button" class="btn small" data-proxy-parse>${icon('wave')}识别填入</button></div><p>支持 协议://用户:密码@主机:端口、主机:端口:用户:密码 · 省略协议默认 HTTP</p></section><p data-proxy-feedback role="status" class="${parseError?'form-error':''}" ${parseError?'':'hidden'}>${parseError}</p><label class="field proxy-full">代理名称<input name="name" value="${escape(p?.name||'')}" placeholder="例如：新加坡主线路" required></label>${renderChoiceSelect('protocol','代理类型',[['http','HTTP'],['socks5','SOCKS5'],['socks5h','SOCKS5H']],fields.protocol)}${renderNumberControl('port','端口',fields.port,1,65535)}<label class="field proxy-full">主机 / IP 地址<input name="host" value="${escape(fields.host)}" placeholder="proxy.example.test 或 IPv4 / IPv6" required></label><label class="field">用户名<input name="username" value="${escape(p?.username??fields.username)}" autocomplete="off" placeholder="可选"></label><label class="field">密码<input name="password" type="password" value="${escape(p?.password??fields.password)}" autocomplete="new-password" placeholder="可选"></label><section class="proxy-expiry-editor proxy-full">${renderDateTimeControl('expiresAt','到期时间',proxyLocalDate(p?.expiresAt))}<div class="proxy-expiry-actions"><span>快速延长</span><button type="button" data-proxy-extend="30">延长 30 天</button><button type="button" data-proxy-extend="90">延长 90 天</button><button type="button" data-proxy-expiry-clear>不设置</button></div><p class="form-help">按浏览器本地时间填写。未到期从原时间延长，其余从现在延长；保存后生效。</p></section><div class="confirm-footer proxy-full"><span>本地示例配置</span><button class="btn" type="button" data-close>取消</button><button class="btn primary" type="submit">保存代理</button></div></form>`);
 activeActionDialog().classList.add('proxy-editor');
}
/** 仅模拟检测状态，不访问示例地址。@param id 代理编号。@return 无。 */
function testProxy(id){const proxy=previewProxies.find(p=>p.id===id);if(!proxy||proxy.status==='testing')return;proxy.status='testing';const generation=(proxy.generation||0)+1;proxy.generation=generation;if(current==='proxies')$('#page').innerHTML=proxyPage();setTimeout(()=>{
 if(!previewProxies.includes(proxy)||proxy.generation!==generation)return;
 proxy.checkedAt=Date.now();
 if(id===3){proxy.status='failed';proxy.error='检测超时 · 示例';}
 else{proxy.status='ready';proxy.error='';proxy.observation={ip:id===1?'203.0.113.18':id===2?'198.51.100.42':'203.0.113.99',region:id===1?'新加坡':id===2?'美国':null,city:id===1?'新加坡':id===2?'洛杉矶':null,code:id===1?'SG':id===2?'US':null,latencyMs:id===1?68:id===2?156:92,checkedAt:Date.now()};}
 if(current==='proxies')$('#page').innerHTML=proxyPage();
 },700)}
/** 展示代理动作对应上下文。@param action 动作。@param id 编号。@return 无。 */
function proxyAction(action,id){const p=previewProxies.find(p=>p.id===Number(id));if(!p)return;if(action==='test'){testProxy(p.id);return}if(action==='edit'){editProxy(p.id);return}if(action==='accounts'){expandedProxyId=expandedProxyId===p.id?null:p.id;$('#page').innerHTML=proxyPage();return}if(action==='delete'){actionModal('删除代理',`<p>${accountsUsingProxy(p.id).length?'此代理正被 '+accountsUsingProxy(p.id).length+' 个账号或登录草稿使用，请先切换代理或移除草稿。':'确认删除「'+escape(p.name)+'」？'}</p><div class="confirm-footer"><button class="btn" data-close>返回</button>${accountsUsingProxy(p.id).length?'':`<button class="btn danger" data-proxy-confirm-delete="${p.id}">确认删除</button>`}</div>`)}}

/** 生成可搜索的勾选面板。@param field allowed或blocked。@return 选择器HTML。 */

/** 根据草稿更新标签，保持搜索输入与勾选焦点。@return 无。 */
function refreshTokenPickers(){if(!tokenDraft)return;for(const field of ['allowed','blocked']){
 const dialog=activeActionDialog();const ids=tokenDraft[field];
 dialog.querySelector(`[data-picker-count="${field}"]`).textContent=ids.length?`已选 ${ids.length} 个`:'';
 dialog.querySelector(`[data-picker-selected="${field}"]`).innerHTML=ids.map(id=>{const a=accounts.find(a=>a.id===id);return `<span class="account-chip">${escape(a?.name||'账号 '+id)}<button type="button" data-picker-remove="${field}" data-account-id="${id}" aria-label="移除${escape(a?.name||String(id))}">${icon('close')}</button></span>`}).join('');

/** 打开权限草稿，取消不改列表数据。@param id 令牌ID，null为新增。@return 无。 */

 refreshTokenPickers();

/** 执行某一行的明确动作。@param action 动作。@param id 令牌ID。@return 无。 */
async function handleTokenAction(action,id){const token=previewTokens.find(t=>t.id===Number(id));if(!token)return;
 if(action==='edit'){openTokenEditor(token.id);return}
 if(action==='toggle'){token.enabled=!token.enabled;$('#page').innerHTML=tokenPage();toast(token.enabled?'示例令牌已启用':'示例令牌已停用');return}

}

etail==='configuration'){if(accountDraftNode&&accountDraftId===a.id)$('#drawer-body').replaceChildren(accountDraftNode);else{accountDraftNode=$('#drawer-body [data-form=account]');accountDraftId=a.id;accountEditOriginalSubscription=a.subscription_type}}$('#drawer-body').scrollTop=0}
let actionLayerSequence=0;
/** 获取当前操作层，关闭后自动返回仍打开的父层。@return 当前原生弹窗。 */
function activeActionDialog(){return $$('[data-action-layer][open]').at(-1)||document.getElementById('action-dialog')}
/** 打开独立子窗口，保留父窗口内容与焦点返回位置。@param title 标题。@param body 内容。@return 无。 */
function actionModal(title,body){
 const parent=activeActionDialog();
 let dialog=parent;
 if(parent.open){
  const id='action-layer-'+(++actionLayerSequence);
  dialog=document.createElement('dialog');
  dialog.className='dialog modal-small secondary-dialog';dialog.dataset.actionLayer='';
  dialog.setAttribute('aria-labelledby',id+'-title');
  const parentTitle=parent.querySelector('[data-action-title]').textContent;
  dialog.innerHTML=`<header class="dialog-head"><div><p class="parent-context">${escape(parentTitle)}</p><h2 id="${id}-title" data-action-title></h2></div><button class="icon-button" data-close aria-label="关闭子窗口并返回">${icon('close')}</button></header><div class="dialog-body" data-action-body></div>`;
  document.body.append(dialog);
  dialog.addEventListener('close',()=>{clearInterval(updateTimer);dialog.remove()},{once:true});
 }
 dialog.querySelector('[data-action-title]').textContent=title;
 dialog.querySelector('[data-action-body]').innerHTML=body;
 dialog.classList.toggle('token-editor',body.includes('data-form="token-editor"'));
 dialog.classList.toggle('environment-manager',title==='环境管理');
 dialog.classList.toggle('environment-workspace',body.includes('data-environment-workspace'));
 dialog.classList.toggle('proxy-editor',body.includes('data-form="proxy"'));
 dialog.classList.toggle('work-dialog',body.includes('work-dialog-content'));
 dialog.classList.toggle('work-run-dialog',body.includes('data-run-detail-id'));
 dialog.classList.toggle('upgrade-sheet-dialog',body.includes('upgrade-sheet'));
 dialog.classList.toggle('upgrade-document-dialog',body.includes('data-document-workspace'));
 dialog.classList.toggle('upgrade-login-dialog',body.includes('data-login-workspace')||body.includes('data-continue-workspace'));
 dialog.classList.toggle('work-quota-dialog',body.includes('data-work-quota-detail'));
 dialog.classList.toggle('work-proxy-dialog',body.includes('data-work-proxy-inspector')||body.includes('data-work-form="proxy-switch"'));
 dialog.showModal();

/** 渲染授权登录的步骤、连接状态及可恢复终端。@param draft 登录草稿。@return HTML。 */
function renderWorkLoginSession(draft){const connected=draft.connected!==false,url='https://auth.example.test/authorize?session=demo-'+draft.id;return `<div data-login-workspace="${draft.id}"><div class="upgrade-session-banner"><span>${icon('key')}</span><div><strong>${escape(draft.name)}</strong><small>本地授权流程预览 · 使用 demo-code 验证</small></div><span class="work-badge ${connected?'good':'warning'}">${connected?'终端已连接':'连接已断开'}</span></div><ol class="upgrade-steps"><li class="done">1<span>准备环境</span></li><li class="${draft.ready?'done':'active'}">2<span>浏览器授权</span></li><li class="${draft.ready?'active':''}">3<span>提交保存</span></li></ol><div class="upgrade-session-scroll"><section class="upgrade-card"><header><h3>授权链接</h3><small>预览地址</small></header><div class="upgrade-card-body"><code class="upgrade-auth-url">${url}</code><div class="buttons"><button class="btn small" data-login-copy="${draft.id}">${icon('copy')}复制链接</button><button class="btn small" data-login-preview="${draft.id}">${icon('arrow')}打开授权预览</button></div></div></section><form data-work-form="auth-code" data-draft-id="${draft.id}" class="upgrade-auth-code"><label class="field">授权码<input name="work_authorization_code" autocomplete="off" placeholder="本地预览请输入 demo-code" ${draft.ready?'disabled':''}></label><button class="btn primary" type="submit" ${!connected||draft.ready?'disabled':''}>${draft.ready?'验证通过':'验证授权码'}</button><p class="work-form-error" role="alert"></p></form><section class="upgrade-terminal"><header><span>${icon('box')}登录终端</span><div><button type="button" data-login-connect="${draft.id}" ${connected?'disabled':''}>重新连接</button><button type="button" data-login-restart="${draft.id}">重新登录</button></div></header><pre>${escape((draft.logs||['登录环境已就绪','等待浏览器授权…']).join('\n'))}${draft.ready?'\n认证通过，等待提交保存。':''}</pre></section><div class="upgrade-session-context"><span>${escape(workProxyInfo(draft.proxyId).name)} · ${escape(draft.timezone)}</span><span>${draft.bindingAtOpen?'提交后同步关联账号 #'+escape(draft.bindingAtOpen):'提交后保存为任务账号'}</span></div><details class="upgrade-preview-controls"><summary>预览状态控制</summary><button type="button" class="btn small" data-login-disconnect="${draft.id}">模拟连接中断</button></details></div><footer class="work-form-footer"><button class="btn danger" type="button" data-login-cancel="${draft.id}">取消登录</button><button class="btn small" type="button" data-work-login-simulate="${draft.id}" ${connected?'':'disabled'}>模拟认证通过</button><button class="btn primary" type="button" data-work-login-commit="${draft.id}" ${draft.ready?'':'disabled'}>提交保存</button></footer></div>`}
/** 就地更新当前登录面板，避免二级窗口覆盖父层。@param draft 草稿。@param dialog 当前窗口。@return 无。 */
function repaintWorkLogin(draft,dialog){dialog.querySelector('.work-dialog-content').innerHTML=renderWorkLoginSession(draft)}
const workConversations=new Map();
/** 渲染保留原会话的继续对话界面。@param id 运行ID。@return 无。 */
function openWorkContinuation(id){const run=workRuns.find(r=>r.id===id);if(!run)return;if(!workConversations.has(id))workConversations.set(id,[]);workDialog('继续原会话',`<div data-continue-workspace="${escape(id)}"><div class="upgrade-session-banner"><span>${icon('wave')}</span><div><strong>${escape(run.title)}</strong><small>${escape(id)} · 原工作区与会话</small></div><span data-continuation-status>${workBadge(run.status)}</span></div><div class="upgrade-conversation" data-conversation-messages>${renderWorkConversation(id)}</div><form data-work-form="continuation" data-run-id="${escape(id)}" class="upgrade-composer"><label class="field">补充需求<textarea name="continuation" rows="3" required placeholder="输入接下来希望完成的工作"></textarea></label><div><span>本地交互预览</span><button type="submit" class="btn primary">发送并继续</button></div><p class="work-form-error" role="alert"></p></form></div>`)}
/** 显示本地对话记录，内容作为纯文本渲染。@param id 运行ID。@return HTML。 */
function renderWorkConversation(id){const entries=workConversations.get(id)||[];return `<div class="upgrade-conversation-note">${icon('shield')}原工作目录与会话保持，补充内容在当前会话继续。</div>${entries.length?entries.map(entry=>`<article class="upgrade-message ${entry.role}"><span>${entry.role==='user'?'你':'预览回执'}</span><p>${escape(entry.text)}</p></article>`).join(''):'<div class="upgrade-conversation-empty">'+icon('wave')+'<h3>从上次的工作继续</h3><p>补充一个目标、问题或验收要求。</p></div>'}`}
document.addEventListener('submit',event=>{const form=event.target,group=form.dataset.workForm;if(!['auth-code','continuation'].includes(group))return;event.preventDefault();event.stopImmediatePropagation();const data=new FormData(form),error=form.querySelector('.work-form-error');error.textContent='';
 if(group==='auth-code'){const d=workLoginDrafts.find(d=>d.id===Number(form.dataset.draftId));if(!d)return;if(d.connected===false){error.textContent='请先重新连接登录终端';return}if(String(data.get('work_authorization_code')).trim()!=='demo-code'){error.textContent='本地预览仅接受 demo-code。真实授权码请用于正式登录。';return}d.ready=true;d.logs=[...(d.logs||[]),'授权码已验证 · 示例'];repaintWorkLogin(d,form.closest('dialog'));return}
 const id=form.dataset.runId,run=workRuns.find(r=>r.id===id),text=String(data.get('continuation')).trim();if(!text){error.textContent='请输入补充需求';return}if(!run){error.textContent='运行记录已不可用';return}workConversations.get(id).push({role:'user',text},{role:'assistant',text:'补充需求已保存到本地示例会话，运行状态已切换为执行中。'});run.status='running';run.exit_code=null;workRunDetailSamples.get(id)?.logs.push('[继续会话] '+text);form.reset();const dialog=form.closest('dialog');dialog.querySelector('[data-continuation-status]').innerHTML=workBadge(run.status);dialog.querySelector('[data-conversation-messages]').innerHTML=renderWorkConversation(id);repaintWork();form.querySelector('textarea').focus();
},true);
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;const id=Number(b.dataset.loginCopy||b.dataset.loginPreview||b.dataset.loginConnect||b.dataset.loginRestart||b.dataset.loginDisconnect||b.dataset.loginCancel);if(!id)return;const draft=workLoginDrafts.find(d=>d.id===id);if(!draft)return;const dialog=b.closest('dialog');
 if(b.dataset.loginCopy){void copyRequestId('https://auth.example.test/authorize?session=demo-'+id,b,'授权链接');return}
 if(b.dataset.loginPreview){workDialog('浏览器授权预览','<section class="upgrade-auth-preview"><span>'+icon('shield')+'</span><h3>授权页面已就绪</h3><p>返回登录窗口，填写以下示例授权码。</p><code>demo-code</code><p class="work-note">当前为离线预览。</p><button class="btn primary" data-close>返回填写授权码</button></section>');return}
 if(b.dataset.loginCancel){confirmWork('取消登录','结束当前登录并保留未提交草稿，稍后可继续。',()=>{draft.connected=false;draft.ready=false;draft.logs=['登录已取消，草稿保留'];dialog.close()});return}
 if(b.dataset.loginDisconnect){draft.connected=false;draft.logs=[...(draft.logs||[]),'终端连接已中断']}
 if(b.dataset.loginConnect){draft.connected=true;draft.logs=[...(draft.logs||[]),'已重新连接原登录终端']}
 if(b.dataset.loginRestart){draft.connected=true;draft.ready=false;draft.logs=['已重新开始登录','等待新的浏览器授权…']}
 repaintWorkLogin(draft,dialog);
});

const workCaptureSamples=new Map();
const captureExample={available:true,message:'已读取脱敏抓包索引 · 本地示例',claude_code_version:'2.1.293',claude_effort_level:'high',mode:'full_http',permission_mode:'bypassPermissions',model_override:null,index:{total_flows:2,cc_versions:['2.1.293'],entries:[{flow_id:'flow-demo-01',client_connection_id:'client-demo-01',request:{method:'POST',host:'api.example.test',path:'/v1/messages',body_bytes:1240},response:{status:200,body_bytes:2850},analysis:{cc_version:'2.1.293'},capture_state:'complete'},{flow_id:'flow-demo-02',client_connection_id:'client-demo-01',request:{method:'POST',host:'api.example.test',path:'/v1/messages',body_bytes:1680},response:{status:200,body_bytes:1940},analysis:{cc_version:'2.1.293'},capture_state:'complete'}]},files:[{path:'capture-index.json',size:1840},{path:'tls-clienthello.jsonl',size:720}],tls_clienthello:{available:true,total_records:1,count_exact:true,entries:[{client_connection_id:'client-demo-01',direction:'outbound',sni:'api.example.test',supported_versions:[772,771],alpn_protocols:[{text:'h2'}],fields_incomplete:true,ja3:{string:null,md5:null}}]}};
workCaptureSamples.set('capture-demo-observed',structuredClone(captureExample));
workRuns.push({id:'capture-demo-observed',task_id:1,account_id:102,title:'请求诊断采集示例',status:'success',run_kind:'capture',duration:152,exit_code:0,tokens_in:null,tokens_out:null,requests:2});
workRunDetailSamples.set('capture-demo-observed',{prompt:'核对请求诊断的采集入口。',followups:[],stats:{claude_code_version:'2.1.293',claude_effort_level:'high',model_override:'默认（抓包配置）'},files:[],logs:['[14:20:00] 抓包运行开始','[14:22:32] 已保存脱敏索引与TLS记录']});
/** 使用原抓包字段呈现已采集、等待及未启用状态。@param id 运行或工作ID。@return HTML。 */
function renderWorkCapture(id){const sample=workCaptureSamples.get(id),run=workRuns.find(r=>r.id===id);if(!sample?.available)return `<div class="run-empty-state">${icon('shield')}<h3>${run?.run_kind==='capture'?'抓包正在准备':'当前运行未开启抓包'}</h3><p>${sample?.message||'内容按发生时配置保存，历史数据保持原采集状态。'}</p>${run?.run_kind==='capture'?`<button type="button" class="btn" data-capture-sample="${escape(id)}">加载示例抓包结果</button>`:''}</div>`;return `<div data-capture-workspace="${escape(id)}"><div class="upgrade-capture-overview"><div><span>采集请求</span><strong>${sample.index.total_flows}</strong></div><div><span>运行版本</span><strong>${escape(sample.claude_code_version)}</strong></div><div><span>思考预算</span><strong>${escape(sample.claude_effort_level)}</strong></div></div><div class="upgrade-capture-toolbar"><div class="upgrade-reading-tabs">${[['index','请求索引'],['files','采集文件'],['tls','TLS 握手']].map(([key,label],i)=>`<button type="button" data-capture-tab="${key}" class="${i?'':'active'}">${label}</button>`).join('')}</div><button class="btn small" data-capture-copy="${escape(id)}">${icon('copy')}复制索引</button></div><p class="work-note">${escape(sample.message)} · ${escape(sample.permission_mode)}</p><section data-capture-panel="index"><div class="work-table-wrap"><table class="work-table"><thead><tr><th>请求</th><th>结果</th><th>请求 / 响应</th><th>详情</th></tr></thead><tbody>${sample.index.entries.map(entry=>`<tr><td><strong>${escape(entry.request.method+' '+entry.request.path)}</strong><small>${escape(entry.flow_id+' · '+entry.client_connection_id)}</small></td><td>${entry.response.status} · ${entry.capture_state==='complete'?'已完成':'响应中'}</td><td>${entry.request.body_bytes} / ${entry.response.body_bytes} B</td><td><button type="button" data-capture-flow="${escape(entry.flow_id)}">查看</button></td></tr>`).join('')}</tbody></table></div><pre class="work-log" data-capture-flow-detail hidden></pre></section><section data-capture-panel="files" hidden>${sample.files.map(file=>`<div class="work-file">${icon('task')}<code>${escape(file.path)}</code><small>${file.size} B</small><button type="button" data-capture-file="${escape(file.path)}">预览</button></div>`).join('')}<pre class="work-log" data-capture-file-detail hidden></pre></section><section data-capture-panel="tls" hidden><section class="upgrade-card"><header><h3>ClientHello</h3><span>${sample.tls_clienthello.total_records} 条握手</span></header><div class="upgrade-card-body"><p class="work-note">以下为已采集的示例字段，未采集的指纹保持空值。</p><pre class="work-log">${escape(JSON.stringify(sample.tls_clienthello.entries,null,2))}</pre></div></section></section></div>`}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;
 if(button.dataset.captureSample){const id=button.dataset.captureSample,old=workCaptureSamples.get(id),sample={...structuredClone(captureExample),...old,available:true,message:'已读取脱敏抓包索引 · 本地示例'};sample.index=structuredClone(captureExample.index);sample.index.cc_versions=[sample.claude_code_version];sample.index.entries.forEach(entry=>entry.analysis.cc_version=sample.claude_code_version);workCaptureSamples.set(id,sample);const run=workRuns.find(r=>r.id===id);if(run){run.status='success';run.exit_code=0;run.requests=sample.index.total_flows;workRunDetailSamples.get(id)?.logs.push('已保存示例抓包结果')}button.closest('dialog').close();openWorkRun(id);activeActionDialog().querySelector('[data-work-detail-tab="capture"]').click();repaintWork();return}
 const workspace=button.closest('[data-capture-workspace]');if(!workspace)return;const sample=workCaptureSamples.get(workspace.dataset.captureWorkspace);
 if(button.dataset.captureTab){workspace.querySelectorAll('[data-capture-tab]').forEach(b=>b.classList.toggle('active',b===button));workspace.querySelectorAll('[data-capture-panel]').forEach(panel=>panel.hidden=panel.dataset.capturePanel!==button.dataset.captureTab)}
 if(button.dataset.captureCopy)void copyRequestId(JSON.stringify(sample.index,null,2),button,'脱敏抓包索引');
 if(button.dataset.captureFlow){const pre=workspace.querySelector('[data-capture-flow-detail]');pre.hidden=false;pre.textContent=JSON.stringify(sample.index.entries.find(entry=>entry.flow_id===button.dataset.captureFlow),null,2)}
 if(button.dataset.captureFile){const pre=workspace.querySelector('[data-capture-file-detail]');pre.hidden=false;pre.textContent=JSON.stringify(button.dataset.captureFile==='capture-index.json'?sample.index:sample.tls_clienthello.entries,null,2)}
});

restorePreviewLocation();
