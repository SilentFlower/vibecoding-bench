const ic = (n, c = '') => `<svg class="i ${c}" viewBox="0 0 24 24">${P[n]}</svg>`;
const logo = (s = 26) => `<svg class="logo" width="${s}" height="${s}" viewBox="0 0 256 256"><defs><path id="pt" d="M128 121C116 103 94 79 94 58C94 37 109 21 128 21S162 37 162 58C162 79 140 103 128 121Z"/></defs><g fill="#ED6EA7">${[0,72,144,216,288].map(r=>`<use href="#pt" transform="rotate(${r} 128 128)"/>`).join('')}</g><circle cx="128" cy="128" r="15" fill="#191b2c"/></svg>`;

const plat = p => p === 'agy' ? '<span class="tag t-agy">反重力</span>' : '<span class="tag t-cc">Claude Code</span>';

function shell(active, content, extra = '') {

    ['资源', [['proxies', 'globe', '代理管理'], ['environments', 'box', '运行环境'], ['nodes', 'server', '节点管理']]],
    ['工作区', [['tasks', 'todo', '任务与工程', '<span class="sb-run">1</span>']]],
    ['系统', [['settings', 'sliders', '系统设置'], ['updates', 'download', '系统更新', '<span class="sb-count" style="color:#f6a8cb">新</span>']]],
  ];
  return `<div class="app"><aside class="sb">
    <div class="sb-brand">${logo()}<b>flower2api</b><span class="sb-ver"><i></i>v1.0.0</span></div>
    <div class="sb-search">${ic('search', 's14')}搜索或跳转<kbd>⌘K</kbd></div>
    ${nav.map(([g, items]) => `<div class="sb-label">${g}</div>${items.map(([k, i, l, x = '']) => `<div class="sb-item${k === active ? ' on' : ''}">${ic(i, 's18')}${l}${x}</div>`).join('')}`).join('')}
    <div class="sb-foot"><div class="av">管</div><div><b>管理员</b><span>本地管理控制台</span></div><div class="tools"><span>${ic('panel', 's14')}</span><span>${ic('logout', 's14')}</span></div></div>
  </aside><main class="main"><div class="page">${content}</div>${extra}</main></div>`;
}
const ph = (title, count, desc, actions) => `<header class="ph"><div class="ph-main"><h1>${title}${count ? `<span class="ph-count">${count}</span>` : ''}</h1><p>${desc}</p></div><div class="ph-actions">${actions}</div></header>`;

function accountCard(a) {
  const body = a.alert

    : a.off ? `<div class="alert a-neutral">${ic('pause')}<div><b style="color:var(--text)">账号已停用</b>不参与调度，用量统计保留</div><span class="btn btn-sm btn-secondary">启用</span></div>`
    : a.q.map(([l, v, r, t]) => `<div class="q"><span class="l">${l}</span><div class="bar ${t || ''}"><i style="width:${v}%"></i></div><span class="p">${v}%</span><span class="r">${r}后重置</span></div>`).join('')
      + `<div class="usage-line">${ic('activity', 's14')}近 5 小时 <b>${a.use[0]}</b> 请求 · <b>${a.use[1]}</b> Token · <b>${a.use[2]}</b>${ic('info', 's14')}</div>`;
  return `<article class="card ec${a.off ? ' dim' : ''}">
    <div class="ec-head"><div class="av ${a.p}">${a.n.match(/\d+$/)[0]}</div><div class="ec-id"><div class="ec-title"><b>${a.n}</b><span class="tag t-plan">${a.plan}</span></div><div class="ec-sub">${a.e}</div></div>${badge(a.st[0], a.st[1])}</div>
    <div class="ec-chips">${a.p === 'agy' ? plat('agy') : plat('cc')}<span>${ic('globe', 's14')}${a.route}</span><span>${ic('server', 's14')}${a.node}</span></div>
    <div class="ec-body">${body}</div>
    <div class="metrics">${a.m.map(([l, v, s = '', c = '']) => `<div class="${c}"><span>${l}</span><b>${v}<small>${s}</small></b></div>`).join('')}</div>
    <div class="ec-foot"><span class="grow">${a.foot}</span><span class="btn btn-sm btn-ghost">${ic('zap', 's14')}测试</span><span class="btn btn-sm btn-secondary">详情</span><span class="btn btn-sm btn-ghost btn-icon">${ic('more')}</span></div>
  </article>`;
}
