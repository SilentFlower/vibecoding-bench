[package]
name = "ccrb-tls-verifier"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["."]

[dependencies]
base64 = "=0.22.1"
hex = "=0.4.3"
ml-kem = { version = "=0.2.3", features = ["zeroize"] }
rand = "=0.8.5"
rustls = { path = "../vendor/craftls/rustls", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "=2.2.0"
rustls-pki-types = "=1.14.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
static_init = "=1.0.4"
tokio = { version = "=1.51.0", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time"] }
tokio-rustls = "=0.25.0"
webpki-roots = "=0.26.11"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zeroize = "=1.8.2"

[patch.crates-io]
rustls = { path = "../vendor/craftls/rustls" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"

